<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netflix Sign Up</title>
    <link rel="stylesheet" href="./external.css" />
  </head>
  <body>
    <div class="background">
      <div class="header">
        <svg width="150" height="50" viewBox="0 0 150 50">
          <rect x="0" y="0" width="150" height="50" fill="#221F1F" rx="4" />
          <text
            x="75"
            y="36"
            font-size="32"
            font-weight="900"
            fill="#E50914"
            text-anchor="middle"
          >
            NETFLIX
          </text>
        </svg>
      </div>
      <div class="center">
        <div class="signup-box">
          <h1>Create Your Account</h1>

          <input type="text" placeholder="First Name" />
          <input type="text" placeholder="Last Name" />
          <input type="email" placeholder="Email address" />
          <input type="password" placeholder="Password" />
          <input type="password" placeholder="Confirm Password" />

          <div class="terms">
            <input type="checkbox" />
            <span
              >I agree to the Netflix <span class="red">Terms of Use</span> and
              <span class="red">Privacy Policy</span>
            </span>
          </div>

          <button>Create Account</button>

          <div class="login">
            Already have an account? <span class="red">Sign In</span>
          </div>

          <div class="help">
            Need help? <span class="red">Contact Support</span>
          </div>

          <div class="captcha">
            This page is protected by Google reCAPTCHA to ensure you're not a
            bot.
            <span class="red">Learn more</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
